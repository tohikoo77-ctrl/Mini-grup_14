components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        order:
          type: integer
        in_tashkent:
          type: boolean
        address_name:
          type: string
          maxLength: 255
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        street:
          type: string
          maxLength: 255
        home:
          type: string
          maxLength: 20
        apartment:
          type: string
          nullable: true
          maxLength: 20
      required:
      - address_name
      - home
      - id
      - street
    AddressRequest:
      type: object
      properties:
        order:
          type: integer
        in_tashkent:
          type: boolean
        address_name:
          type: string
          minLength: 1
          maxLength: 255
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        street:
          type: string
