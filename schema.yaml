          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgetPasswordRequest'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Password reset code sent
          description: ''
